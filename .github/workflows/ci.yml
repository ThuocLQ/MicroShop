name: MicroShop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: microshop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate repository layout
        shell: pwsh
        run: ./scripts/test-repository-layout.ps1

      - name: Restore
        run: dotnet restore MicroShop.sln --nologo

      - name: Build
        run: dotnet build MicroShop.sln --no-restore --nologo -v minimal

      - name: Test
        run: dotnet test Tests/MicroShop.IntegrationTests/MicroShop.IntegrationTests.csproj --no-build --nologo -v minimal

  supplier-build-test:
    name: Build and test SupplierService
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn -B -ntp -f Services/SupplierService/pom.xml verify

  frontend-build-test:
    name: Build and lint frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app:
          - storefront
          - operations

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        working-directory: Frontend/apps/${{ matrix.app }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: Frontend/apps/${{ matrix.app }}
        run: pnpm lint

      - name: Build
        working-directory: Frontend/apps/${{ matrix.app }}
        run: pnpm build

  frontend-browser-e2e:
    name: Storefront browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - frontend-build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install Storefront dependencies
        working-directory: Frontend/apps/storefront
        run: pnpm install --frozen-lockfile

      - name: Build Storefront
        working-directory: Frontend/apps/storefront
        run: pnpm build

      - name: Install browser E2E dependencies
        working-directory: Frontend/e2e
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: Frontend/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storefront browser E2E
        working-directory: Frontend/e2e
        run: pnpm test

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-e2e-report
          path: Frontend/e2e/playwright-report
          if-no-files-found: ignore
  runtime-validation:
    name: Runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate DbUp migration naming
        shell: pwsh
        run: ./scripts/Test-DbUpMigrationNaming.ps1 -BaseRef "${{ github.event.before || github.event.pull_request.base.sha }}"

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/k3s-backup.ps1",
            "scripts/k3s-create-secrets.ps1",
            "scripts/k3s-create-ghcr-pull-secret.ps1",
            "scripts/k3s-deploy.ps1",
            "scripts/k3s-install-cert-manager.ps1",
            "scripts/k3s-observability-smoke.ps1",
            "scripts/k3s-restore.ps1",
            "scripts/k3s-smoke.ps1",
            "scripts/k3s-validate.ps1",
            "scripts/local-prod-backup.ps1",
            "scripts/local-prod-restore.ps1",
            "scripts/local-prod-observability-smoke.ps1",
            "scripts/local-prod-observability-up.ps1",
            "scripts/local-prod-rc-verify.ps1",
            "scripts/local-prod-smoke.ps1",
            "scripts/gateway-route-security-smoke.ps1",
            "scripts/notification-delivery-smoke.ps1",
            "scripts/notification-dead-letter-smoke.ps1",
            "scripts/notification-preference-smoke.ps1",
            "scripts/procurement-smoke.ps1",
            "scripts/local-prod-up.ps1",
            "scripts/portfolio-customer-smoke.ps1",
            "scripts/session-revocation-smoke.ps1",
            "scripts/portfolio-seed.ps1",
            "scripts/portfolio-up.ps1",
            "scripts/portfolio-public-up.ps1",
            "scripts/portfolio-public-down.ps1",
            "scripts/test-kafka-lesson25.ps1",
            "scripts/test-order-outbox-kafka.ps1",
            "scripts/test-projection-reliability.ps1",
            "scripts/Test-DbUpMigrationNaming.ps1"
          )

          foreach ($script in $scripts) {
            $errors = $null
            [System.Management.Automation.PSParser]::Tokenize((Get-Content $script -Raw), [ref]$errors) | Out-Null
            if ($errors) {
              $errors | Format-List
              throw "PowerShell parser errors found in $script."
            }
          }

      - name: Validate local-prod compose
        run: docker compose --env-file .env.example -f compose.local-prod.yml config --quiet

      - name: Validate local-prod observability compose
        run: docker compose --env-file .env.example -f compose.local-prod.yml -f compose.observability.yml config --quiet

      - name: Validate portfolio compose
        run: docker compose --env-file .env.example -f compose.local-prod.yml -f compose.portfolio.yml config --quiet

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate K3s Helm chart
        run: |
          helm lint deploy/k3s/microshop --namespace microshop
          helm template microshop deploy/k3s/microshop --namespace microshop --set global.imageTag=ci >/tmp/microshop-k3s.yaml

      - name: Build representative Docker images
        run: |
          docker build \
            -f Dockerfile.service \
            --build-arg PROJECT_PATH=Gateways/ApiGateway/ApiGateway.csproj \
            --build-arg PROJECT_DLL=ApiGateway.dll \
            -t microshop/api-gateway:ci .

          docker build \
            -f Dockerfile.service \
            --build-arg PROJECT_PATH=Services/OrderingService/OrderingService.csproj \
            --build-arg PROJECT_DLL=OrderingService.dll \
            -t microshop/orderingservice:ci .

          docker build \
            -f Dockerfile.service \
            --build-arg PROJECT_PATH=Services/InventoryService/InventoryService.csproj \
            --build-arg PROJECT_DLL=InventoryService.dll \
            -t microshop/inventoryservice:ci .

          docker build \
            -f Dockerfile.service \
            --build-arg PROJECT_PATH=Workers/ProjectionWorker/ProjectionWorker.csproj \
            --build-arg PROJECT_DLL=ProjectionWorker.dll \
            -t microshop/projectionworker:ci .

  docker-images:
    name: Build service images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - build-test
      - runtime-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: microshop-api-gateway
            project: Gateways/ApiGateway/ApiGateway.csproj
            dll: ApiGateway.dll
          - image: microshop-catalogservice
            project: Services/CatalogService/CatalogService.csproj
            dll: CatalogService.dll
          - image: microshop-inventoryservice
            project: Services/InventoryService/InventoryService.csproj
            dll: InventoryService.dll
          - image: microshop-basketservice
            project: Services/BasketService/BasketService.csproj
            dll: BasketService.dll
          - image: microshop-orderingservice
            project: Services/OrderingService/OrderingService.csproj
            dll: OrderingService.dll
          - image: microshop-discountservice
            project: Services/DiscountService/DiscountService.csproj
            dll: DiscountService.dll
          - image: microshop-identityservice
            project: Services/IdentityService/IdentityService.csproj
            dll: IdentityService.dll
          - image: microshop-paymentservice
            project: Services/PaymentService/PaymentService.csproj
            dll: PaymentService.dll
          - image: microshop-orderqueryservice
            project: Services/OrderQueryService/OrderQueryService.csproj
            dll: OrderQueryService.dll
          - image: microshop-notificationworker
            project: Workers/NotificationWorker/NotificationWorker.csproj
            dll: NotificationWorker.dll
          - image: microshop-projectionworker
            project: Workers/ProjectionWorker/ProjectionWorker.csproj
            dll: ProjectionWorker.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.service
          push: ${{ github.event_name == 'push' }}
          build-args: |
            PROJECT_PATH=${{ matrix.project }}
            PROJECT_DLL=${{ matrix.dll }}
          tags: |
            ghcr.io/thuoclq/${{ matrix.image }}:main
            ghcr.io/thuoclq/${{ matrix.image }}:main-${{ github.sha }}
  portfolio-images:
    name: Build portfolio images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - supplier-build-test
      - frontend-build-test
      - runtime-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: microshop-supplierservice
            context: ./Services/SupplierService
            dockerfile: ./Services/SupplierService/Dockerfile
          - image: microshop-storefront
            context: ./Frontend/apps/storefront
            dockerfile: ./Frontend/apps/storefront/Dockerfile
          - image: microshop-operations
            context: ./Frontend/apps/operations
            dockerfile: ./Frontend/apps/operations/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/thuoclq/${{ matrix.image }}:main
            ghcr.io/thuoclq/${{ matrix.image }}:main-${{ github.sha }}
