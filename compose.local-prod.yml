name: microshop-local-prod

x-service-runtime: &service-runtime
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - microshop-network

x-web-service-runtime: &web-service-runtime
  <<: *service-runtime
  expose:
    - "8080"
  healthcheck:
    test:
      - CMD-SHELL
      - >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n" >&3 &&
        head -n 1 <&3 | grep -q " 200 "'
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-worker-runtime: &worker-runtime
  <<: *service-runtime
  stop_grace_period: 60s

services:
  reverse-proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "127.0.0.1:5027:8080"
    volumes:
      - ./docker/caddy/Caddyfile.local-prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/alive | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - microshop-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: microshop
      POSTGRES_PASSWORD: ${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microshop -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - microshop-network

  postgres-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod}
    command: >
      sh -ec 'for database in catalogdb inventorydb orderingdb discountdb identitydb paymentdb notificationdb supplierdb;
      do psql -h postgres -U microshop -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '\''$$database'\''" |
      grep -q 1 || psql -h postgres -U microshop -d postgres -c "CREATE DATABASE $$database OWNER microshop";
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microshop-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - microshop-network

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8025/api/v1/info >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - microshop-network
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      RABBITMQ_DEFAULT_USER: microshop
      RABBITMQ_DEFAULT_PASS: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - microshop-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microshop-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - microshop-network

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic microshop.order-events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic microshop.order-events.retry --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic microshop.order-events.dlt --partitions 3 --replication-factor 1
    networks:
      - microshop-network

  mongodb:
    profiles:
      - read-model
      - projection-rebuild
    image: mongo:7
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      MONGO_INITDB_ROOT_USERNAME: microshop
      MONGO_INITDB_ROOT_PASSWORD: ${MICROSHOP_MONGO_PASSWORD:?Set MICROSHOP_MONGO_PASSWORD in .env.local-prod}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' -u microshop -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - microshop-network

  catalogservice:
    <<: *web-service-runtime
    image: microshop/catalogservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/CatalogService/CatalogService.csproj
        PROJECT_DLL: CatalogService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CatalogDb: Host=postgres;Port=5432;Database=catalogdb;Username=microshop;Password=${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod};GSS Encryption Mode=Disable
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
      InternalApi__Key: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
      ServiceUrls__InventoryHttp: http://inventoryservice:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      inventoryservice:
        condition: service_started

  inventoryservice:
    <<: *web-service-runtime
    image: microshop/inventoryservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/InventoryService/InventoryService.csproj
        PROJECT_DLL: InventoryService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__InventoryDb: Host=postgres;Port=5432;Database=inventorydb;Username=microshop;Password=${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod};GSS Encryption Mode=Disable
      InternalApi__Key: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  basketservice:
    <<: *web-service-runtime
    image: microshop/basketservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/BasketService/BasketService.csproj
        PROJECT_DLL: BasketService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Redis: redis:6379
      Redis__ConnectionString: redis:6379
      ServiceUrls__CatalogHttp: http://catalogservice:8080
      ServiceUrls__InventoryHttp: http://inventoryservice:8080
      ServiceUrls__DiscountHttp: http://discountservice:8080
      ServiceUrls__CatalogGrpc: http://catalogservice:8080
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
    depends_on:
      redis:
        condition: service_healthy
      catalogservice:
        condition: service_healthy

  orderingservice:
    <<: *web-service-runtime
    image: microshop/orderingservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/OrderingService/OrderingService.csproj
        PROJECT_DLL: OrderingService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__OrderingDb: Host=postgres;Port=5432;Database=orderingdb;Username=microshop;Password=${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod};GSS Encryption Mode=Disable
      ServiceUrls__BasketHttp: http://basketservice:8080
      ServiceUrls__CatalogHttp: http://catalogservice:8080
      ServiceUrls__DiscountHttp: http://discountservice:8080
      ServiceUrls__InventoryHttp: http://inventoryservice:8080
      ServiceUrls__IdentityHttp: http://identityservice:8080
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
      InternalApi__Key: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
      OrderEvents__Currency: USD
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
      KafkaOutbox__BootstrapServers: kafka:29092
      KafkaOutbox__Topic: microshop.order-events
      DataProtection__KeysDirectory: /home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      basketservice:
        condition: service_healthy
      inventoryservice:
        condition: service_healthy
      identityservice:
        condition: service_healthy

  discountservice:
    <<: *web-service-runtime
    image: microshop/discountservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/DiscountService/DiscountService.csproj
        PROJECT_DLL: DiscountService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DiscountDb: Host=postgres;Port=5432;Database=discountdb;Username=microshop;Password=${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod};GSS Encryption Mode=Disable
      InternalApi__Key: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-data-protection-init:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    user: "0:0"
    restart: "no"
    command: >
      sh -ec 'mkdir -p /home/app/.aspnet/DataProtection-Keys &&
      chown -R 1654:1654 /home/app/.aspnet/DataProtection-Keys'
    volumes:
      - identity_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - microshop-network
  identityservice:
    <<: *web-service-runtime
    image: microshop/identityservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/IdentityService/IdentityService.csproj
        PROJECT_DLL: IdentityService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=identitydb;Username=microshop;Password=${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod};GSS Encryption Mode=Disable
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
      Jwt__ExpirationMinutes: 120
      InternalApi__Key: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
      BootstrapAdmin__Enabled: "true"
      BootstrapAdmin__UserName: ${MICROSHOP_BOOTSTRAP_ADMIN_USERNAME:?Set MICROSHOP_BOOTSTRAP_ADMIN_USERNAME in .env.local-prod}
      BootstrapAdmin__Password: ${MICROSHOP_BOOTSTRAP_ADMIN_PASSWORD:?Set MICROSHOP_BOOTSTRAP_ADMIN_PASSWORD in .env.local-prod}
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
    volumes:
      - identity_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      identity-data-protection-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  payment-data-protection-init:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    user: "0:0"
    restart: "no"
    command: >
      sh -ec 'mkdir -p /home/app/.aspnet/DataProtection-Keys &&
      chown -R 1654:1654 /home/app/.aspnet/DataProtection-Keys'
    volumes:
      - payment_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - microshop-network
  paymentservice:
    <<: *web-service-runtime
    image: microshop/paymentservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/PaymentService/PaymentService.csproj
        PROJECT_DLL: PaymentService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PaymentDb: Host=postgres;Port=5432;Database=paymentdb;Username=microshop;Password=${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod};GSS Encryption Mode=Disable
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
      ServiceUrls__OrderingHttp: http://orderingservice:8080
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
      InternalApi__Key: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
      PaymentWebhooks__SignatureHeaderName: X-MicroShop-Signature
      PaymentWebhooks__SharedSecret: ${MICROSHOP_PAYMENT_WEBHOOK_SECRET:?Set MICROSHOP_PAYMENT_WEBHOOK_SECRET in .env.local-prod}
      PaymentWebhooks__RequireSignature: "true"
      PaymentProvider__Provider: ${MICROSHOP_PAYMENT_PROVIDER:-CashOnDelivery}
      PaymentProvider__EnabledProviders__0: ${MICROSHOP_PAYMENT_PROVIDER:-CashOnDelivery}
      PaymentProvider__AllowSandbox: ${MICROSHOP_ALLOW_SANDBOX_PAYMENT:-true}
      PaymentProvider__PayPal__Enabled: ${MICROSHOP_PAYPAL_ENABLED:-false}
      PaymentProvider__PayPal__UseSandbox: "true"
      PaymentProvider__PayPal__SupportedCurrencies__0: ${MICROSHOP_PAYPAL_CURRENCY:-USD}
      PaymentProvider__PayPal__ClientId: ${MICROSHOP_PAYPAL_CLIENT_ID:-SET_BY_ENVIRONMENT}
      PaymentProvider__PayPal__ClientSecret: ${MICROSHOP_PAYPAL_CLIENT_SECRET:-SET_BY_ENVIRONMENT}
      PaymentProvider__PayPal__WebhookId: ${MICROSHOP_PAYPAL_WEBHOOK_ID:-SET_BY_ENVIRONMENT}
      PaymentProvider__PayPal__ReturnUrl: ${MICROSHOP_PUBLIC_ORIGIN:-https://shop.invalid}/payment/return
      PaymentProvider__PayPal__CancelUrl: ${MICROSHOP_PUBLIC_ORIGIN:-https://shop.invalid}/payment/cancel
    volumes:
      - payment_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      payment-data-protection-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      orderingservice:
        condition: service_healthy

  orderqueryservice:
    profiles:
      - read-model
      - projection-rebuild
    <<: *web-service-runtime
    image: microshop/orderqueryservice:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Services/OrderQueryService/OrderQueryService.csproj
        PROJECT_DLL: OrderQueryService.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      MongoDb__ConnectionString: ${MICROSHOP_MONGODB_CONNECTION_STRING:?Set MICROSHOP_MONGODB_CONNECTION_STRING in .env.local-prod}
      MongoDb__DatabaseName: MicroShop_OrderReadDb
      MongoDb__OrderSummariesCollectionName: order_summaries
      MongoDb__InitializeMaxRetryCount: 10
      MongoDb__InitializeRetryDelaySeconds: 3
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
    depends_on:
      mongodb:
        condition: service_healthy

  projectionworker:
    profiles:
      - read-model
      - projection-rebuild
    <<: *worker-runtime
    image: microshop/projectionworker:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Workers/ProjectionWorker/ProjectionWorker.csproj
        PROJECT_DLL: ProjectionWorker.dll
    environment:
      DOTNET_ENVIRONMENT: Docker
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: microshop.order-events
      Kafka__RetryTopic: microshop.order-events.retry
      Kafka__DeadLetterTopic: microshop.order-events.dlt
      Kafka__GroupId: projection-worker
      Kafka__AutoOffsetReset: Earliest
      MongoDb__ConnectionString: ${MICROSHOP_MONGODB_CONNECTION_STRING:?Set MICROSHOP_MONGODB_CONNECTION_STRING in .env.local-prod}
      MongoDb__DatabaseName: MicroShop_OrderReadDb
      MongoDb__OrderSummariesCollectionName: order_summaries
      MongoDb__ProjectionFailuresCollectionName: projection_failures
      MongoDb__ProcessedEventsCollectionName: processed_projection_events
      MongoDb__InitializeMaxRetryCount: 10
      MongoDb__InitializeRetryDelaySeconds: 3
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

  notificationworker:
    <<: *web-service-runtime
    image: microshop/notificationworker:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Workers/NotificationWorker/NotificationWorker.csproj
        PROJECT_DLL: NotificationWorker.dll
    environment:
      DOTNET_ENVIRONMENT: Docker
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: microshop
      RabbitMq__Password: ${MICROSHOP_RABBITMQ_PASSWORD:?Set MICROSHOP_RABBITMQ_PASSWORD in .env.local-prod}
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=notificationdb;Username=microshop;Password=${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod};GSS Encryption Mode=Disable
      NotificationDelivery__Mode: Smtp
      NotificationDelivery__Smtp__Host: mailpit
      NotificationDelivery__Smtp__Port: "1025"
      NotificationDelivery__Smtp__EnableSsl: "false"
      NotificationDelivery__Smtp__FromAddress: no-reply@microshop.test
      NotificationDelivery__Smtp__FromDisplayName: MicroShop
      NotificationDelivery__Smtp__PublicStorefrontBaseUrl: ${MICROSHOP_STOREFRONT_PUBLIC_ORIGIN:-http://localhost:5027}
      ServiceUrls__IdentityHttp: http://identityservice:8080
      InternalApi__Key: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      identityservice:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  supplierservice:
    <<: *service-runtime
    image: microshop/supplierservice:local-prod
    build:
      context: ./Services/SupplierService
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supplierdb
      SUPPLIER_DB_USERNAME: microshop
      SUPPLIER_DB_PASSWORD: ${MICROSHOP_POSTGRES_PASSWORD:?Set MICROSHOP_POSTGRES_PASSWORD in .env.local-prod}
      MICROSHOP_JWT_ISSUER: MicroShop.IdentityService
      MICROSHOP_JWT_AUDIENCE: MicroShop.Client
      MICROSHOP_JWT_SECRET_KEY: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
      INVENTORY_BASE_URL: http://inventoryservice:8080
      MICROSHOP_INTERNAL_API_KEY: ${MICROSHOP_INTERNAL_API_KEY:?Set MICROSHOP_INTERNAL_API_KEY in .env.local-prod}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
  api-gateway:
    <<: *web-service-runtime
    image: microshop/api-gateway:local-prod
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: Gateways/ApiGateway/ApiGateway.csproj
        PROJECT_DLL: ApiGateway.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      Gateway__AllowedCorsOrigins__0: http://localhost:5027
      Jwt__Issuer: MicroShop.IdentityService
      Jwt__Audience: MicroShop.Client
      Jwt__SecretKey: ${MICROSHOP_JWT_SECRET_KEY:?Set MICROSHOP_JWT_SECRET_KEY in .env.local-prod}
    depends_on:
      catalogservice:
        condition: service_healthy
      basketservice:
        condition: service_healthy
      orderingservice:
        condition: service_healthy
      discountservice:
        condition: service_healthy
      identityservice:
        condition: service_healthy
      paymentservice:
        condition: service_healthy
      supplierservice:
        condition: service_healthy
      notificationworker:
        condition: service_healthy

  storefront:
    <<: *web-service-runtime
    image: microshop/storefront:local-prod
    build:
      context: ./Frontend/apps/storefront
      dockerfile: Dockerfile
    environment:
      MICROSHOP_GATEWAY_BASE_URL: http://api-gateway:8080
      # The public-tunnel script replaces these with its generated HTTPS origin
      # and secure cookie setting before it presents the URL to users.
      MICROSHOP_PUBLIC_ORIGIN: ${MICROSHOP_STOREFRONT_PUBLIC_ORIGIN:-http://localhost:5027}
      MICROSHOP_COOKIE_SECURE: ${MICROSHOP_STOREFRONT_COOKIE_SECURE:-false}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      api-gateway:
        condition: service_healthy

  operations:
    <<: *web-service-runtime
    image: microshop/operations:local-prod
    build:
      context: ./Frontend/apps/operations
      dockerfile: Dockerfile
    environment:
      MICROSHOP_GATEWAY_BASE_URL: http://api-gateway:8080
      MICROSHOP_PUBLIC_ORIGIN: ${MICROSHOP_OPERATIONS_PUBLIC_ORIGIN:-http://operations.localhost:5027}
      MICROSHOP_COOKIE_SECURE: ${MICROSHOP_OPERATIONS_COOKIE_SECURE:-false}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      api-gateway:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  mongodb_data:
  identity_data_protection_keys:
  payment_data_protection_keys:

networks:
  microshop-network:
    driver: bridge