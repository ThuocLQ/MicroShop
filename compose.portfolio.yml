# Compose override for a 16 GB development laptop or a small portfolio host.
# Combine with compose.local-prod.yml; it does not change images, contracts, or secrets.
# Full read-side behavior remains available through the read-model profile.
services:
  reverse-proxy:
    mem_limit: 96m
    cpus: 0.25

  postgres:
    mem_limit: 768m
    cpus: 0.75

  postgres-init:
    mem_limit: 128m
    cpus: 0.25

  redis:
    mem_limit: 128m
    cpus: 0.25

  mailpit:
    mem_limit: 128m
    cpus: 0.25

  rabbitmq:
    mem_limit: 384m
    cpus: 0.50

  zookeeper:
    mem_limit: 256m
    cpus: 0.25
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx192m

  kafka:
    mem_limit: 1152m
    cpus: 1.00
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m

  kafka-init:
    mem_limit: 256m
    cpus: 0.25

  mongodb:
    mem_limit: 512m
    cpus: 0.50

  catalogservice:
    mem_limit: 256m
    cpus: 0.50

  inventoryservice:
    mem_limit: 320m
    cpus: 0.50

  basketservice:
    mem_limit: 256m
    cpus: 0.50

  orderingservice:
    mem_limit: 384m
    cpus: 0.75

  discountservice:
    mem_limit: 192m
    cpus: 0.35

  identityservice:
    mem_limit: 256m
    cpus: 0.50

  paymentservice:
    mem_limit: 256m
    cpus: 0.50
    # Portfolio is intentionally the only compose profile that enables the
    # simulated provider. The local-prod and Kubernetes manifests remain
    # fail-fast until a commercial provider adapter is configured.
    environment:
      ASPNETCORE_ENVIRONMENT: Portfolio
      ServiceDefaults__ExposeHealthEndpoints: 'true'
      PaymentProvider__Provider: ${MICROSHOP_PAYMENT_PROVIDER:-CashOnDelivery}
      PaymentProvider__EnabledProviders__0: ${MICROSHOP_PAYMENT_PROVIDER:-CashOnDelivery}
      PaymentProvider__PayPal__Enabled: ${MICROSHOP_PAYPAL_ENABLED:-false}
      PaymentProvider__MoMo__Enabled: ${MICROSHOP_MOMO_ENABLED:-false}
      PaymentProvider__MoMo__UseSandbox: ${MICROSHOP_MOMO_USE_SANDBOX:-true}
      PaymentProvider__MoMo__PartnerCode: ${MICROSHOP_MOMO_PARTNER_CODE:-SET_BY_ENVIRONMENT}
      PaymentProvider__MoMo__AccessKey: ${MICROSHOP_MOMO_ACCESS_KEY:-SET_BY_ENVIRONMENT}
      PaymentProvider__MoMo__SecretKey: ${MICROSHOP_MOMO_SECRET_KEY:-SET_BY_ENVIRONMENT}
      PaymentProvider__MoMo__RedirectUrl: ${MICROSHOP_STOREFRONT_PUBLIC_ORIGIN:-https://shop.invalid}/payment/return
      PaymentProvider__MoMo__IpnUrl: ${MICROSHOP_STOREFRONT_PUBLIC_ORIGIN:-https://shop.invalid}/webhooks/momo

  orderqueryservice:
    mem_limit: 256m
    cpus: 0.50

  projectionworker:
    mem_limit: 256m
    cpus: 0.50

  notificationworker:
    mem_limit: 192m
    cpus: 0.35

  supplierservice:
    mem_limit: 384m
    cpus: 0.50

  api-gateway:
    mem_limit: 256m
    cpus: 0.50

  storefront:
    mem_limit: 256m
    cpus: 0.50

  operations:
    mem_limit: 256m
    cpus: 0.50
